name: Test recreated HILEPP policy wrapper
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/checkout@v4
        with:
          repository: RudolfReiter/vehicle_gym
          ref: f0b3106e82ada7e27ee045dadf86b1f1589df87b
          path: foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ./foundation -e './project[train,dev]'
      - run: python -m pytest
        working-directory: project
      - run: ruff check src tests scripts && ruff format --check src tests scripts
        working-directory: project
      - run: python -m build --wheel
        working-directory: project
      - run: node scripts/check_interactions.mjs
        working-directory: project
      - run: python scripts/build_site.py && python scripts/check_data.py && python scripts/check_dynamics.py
        working-directory: project
